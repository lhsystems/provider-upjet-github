    meta.upbound.io/example-id: enterprise/v1alpha1/budget
  labels:
    testing.upbound.io/example-name: test-budget
  name: test-budget
spec:
  forProvider:
    enterprise: lhg
    budgetScope: enterprise
    budgetType: ProductPricing
    budgetProductSku: actions
